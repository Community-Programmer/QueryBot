name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly, so drift against the real model provider is caught without
    # spending an LLM call on every pull request.
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # The analysis specs call a real model, so the suite is skipped rather than
    # failed when no key is configured — a fork PR has no access to secrets.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Write the compose environment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          {
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "SECRET_KEY=$(openssl rand -base64 32)"
            echo "JWT_SECRET_KEY=$(openssl rand -base64 32)"
            echo "SERVICE_TOKEN=$(openssl rand -base64 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "CHART_DOCKER_ENABLED=false"
          } > .env

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              echo "Stack is up after ${attempt} attempts."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The stack did not become healthy in time."
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          # Fall back to the UI-only specs when no model key is available.
          PLAYWRIGHT_GREP: ${{ secrets.GROQ_API_KEY == '' && '@ui' || '' }}
        run: npx playwright test --project=chromium

      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v
